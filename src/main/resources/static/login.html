<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auth</title>
</head>
<body>

<h2>Auth Demo</h2>

<h3>Login</h3>
<input type="email" id="loginEmail" placeholder="Email"><br>
<input type="password" id="loginPassword" placeholder="Password"><br>
<button onclick="login()">Login</button>

<hr>

<h3>Register</h3>
<input type="text" id="regName" placeholder="Name"><br>
<input type="email" id="regEmail" placeholder="Email"><br>
<input type="password" id="regPassword" placeholder="Password"><br>
<button onclick="register()">Register</button>

<hr>

<h3>Recover Password</h3>
<input type="email" id="recEmail" placeholder="Email"><br>
<button onclick="recover()">Recover</button>

<pre id="result"></pre>

<script>
    const baseUrl = "http://localhost:8080";

    function login() {
        fetch(baseUrl + "/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                email: document.getElementById("loginEmail").value,
                password: document.getElementById("loginPassword").value
            })
        })
        .then(r => r.json())
        .then(data => {
            document.getElementById("result").innerText = JSON.stringify(data, null, 2);
        })
        .catch(err => alert(err));
    }

    function register() {
        const params = new URLSearchParams();
        params.append("name", document.getElementById("regName").value);
        params.append("email", document.getElementById("regEmail").value);
        params.append("password", document.getElementById("regPassword").value);

        fetch(baseUrl + "/auth/register", {
            method: "POST",
            body: params
        })
        .then(r => r.json())
        .then(data => {
            document.getElementById("result").innerText = JSON.stringify(data, null, 2);
        })
        .catch(err => alert(err));
    }

    function recover() {
        fetch(baseUrl + "/auth/recover", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                email: document.getElementById("recEmail").value
            })
        })
        .then(r => r.text())
        .then(data => {
            document.getElementById("result").innerText = data;
        })
        .catch(err => alert(err));
    }
</script>

</body>
</html>
